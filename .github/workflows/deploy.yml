name: Déploiement sur 5183

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Un seul déploiement à la fois, sans interrompre celui en cours.
concurrency:
  group: share-e6-5183
  cancel-in-progress: false

jobs:
  deploiement:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Déployer ShareE6 sur la 5183
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Renseigner SSH_HOST}" "${SSH_PORT:?Renseigner SSH_PORT}"
          : "${SSH_USER:?Renseigner SSH_USER}" "${SSH_PRIVATE_KEY:?Renseigner SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Renseigner SSH_KNOWN_HOSTS}"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "bash -se -- $GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          cd /var/www/ShareE6
          test "$(pwd -P)" = /var/www/ShareE6
          test "$(git rev-parse --show-toplevel)" = /var/www/ShareE6
          test "$(git branch --show-current)" = main
          case "$(git remote get-url origin)" in
            https://github.com/rfielbal/ShareE6.git|git@github.com:rfielbal/ShareE6.git) ;;
            *) echo "Le dépôt installé doit être rfielbal/ShareE6."; exit 1 ;;
          esac
          test -s .env.local || { echo "Configurer .env.local sur la 5183."; exit 1; }
          test -z "$(git status --porcelain)" || { echo "Le serveur contient des modifications locales."; exit 1; }

          git fetch origin main
          git merge-base --is-ancestor "$1" origin/main
          if ! git cat-file -e "$1:src/Controller/FichierController.php" 2>/dev/null; then
            echo "Cette version de main ne contient pas la gestion des fichiers. Le serveur conserve la version installée."
            exit 0
          fi
          git merge --ff-only "$1"
          test "$(git rev-parse HEAD)" = "$1"

          export APP_ENV=prod APP_DEBUG=0
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php bin/console dbal:run-sql --no-ansi 'SELECT DATABASE() AS base' |
            grep -Eq '^[[:space:]]*share_e6[[:space:]]*$' || { echo "La base attendue est share_e6."; exit 1; }
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          php bin/console cache:clear
          git log -1 --oneline
          REMOTE

      - name: Supprimer la clé temporaire
        if: always()
        run: rm -f ~/.ssh/deploy_key
